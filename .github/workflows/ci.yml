name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix plugins/eternal-pose/starter/react ci
      - run: npm run check
      - run: npm run test:starter
      - run: npm --prefix plugins/eternal-pose/starter/react exec playwright install --with-deps chromium
      - run: npm run test:e2e
