name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Node 22's bundled npm 10 crashes in arborist ("Cannot read properties
      # of null (reading 'edgesOut')") while installing the staged starter's
      # file: tarballs; npm 11 resolves the same tree fine.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Install pinned font validation tools
        run: |
          python3 -m venv tmp/oak-font-validation
          tmp/oak-font-validation/bin/python -m pip install --disable-pip-version-check -r scripts/requirements-oak-huninn.txt
          echo "$GITHUB_WORKSPACE/tmp/oak-font-validation/bin" >> "$GITHUB_PATH"
      # Build, pack, and install the four unpublished packages in DAG order.
      - run: npm run stage:starter -- --setup-locale en
      - run: npm run check
        timeout-minutes: 15
        env:
          LAUGH_TALE_STARTER_ROOT: ${{ github.workspace }}/tmp/staged-starter
      - run: npm run test:starter:staged
      - run: npm --prefix tmp/staged-starter exec playwright install --with-deps chromium
      - run: npm run test:e2e:staged
      - run: npm run test:oak-washi:browser

  # Generate a synthetic example against locally packed, unpublished packages.
  # Provider calls remain fake in its end-to-end suite.
  example-meridian:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run stage:example
      - run: npm run test:example:identity
      - run: npm run test:example:staged
      - run: npm --prefix tmp/staged-meridian exec playwright install --with-deps chromium
      - run: npm run test:example:e2e

  # The Tokyo v1 baseline is an independent generated project (ADR-0003). It installs
  # the two Laugh Tale packages from tarballs vendored under examples/tokyo/vendor
  # (baseline option c) and everything else from the public registry, so it needs
  # no staging step. It must never call Google: its e2e suite runs on fake adapters.
  example-tokyo:
    runs-on: ubuntu-latest
    defaults:
      run:
        # `npm --prefix <dir> ci` misreads the root package outside the repo; run in place.
        working-directory: examples/tokyo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/tokyo/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  release:
    needs: [check, example-meridian, example-tokyo]
    # Only release from the default branch (not PRs or tags). semantic-release
    # creates the tags itself; its [skip ci] bump commit won't re-trigger CI.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # tags, the version-bump commit, GitHub releases
      issues: write
      pull-requests: write
      id-token: write        # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # semantic-release walks history from the last tag
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Release
        run: npx semantic-release
        env:
          # A fine-grained PAT (Contents/Issues/Pull requests: write) from a repo admin:
          # main's branch protection requires PRs, and the default GITHUB_TOKEN can't
          # bypass it, so @semantic-release/git's push of the version-bump commit fails.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # setup-node's registry-url writes a .npmrc with `_authToken=${NODE_AUTH_TOKEN}`
          # and points NPM_CONFIG_USERCONFIG at it; without NODE_AUTH_TOKEN that placeholder
          # resolves to a dummy value and npm publish 401s. NPM_TOKEN is what
          # @semantic-release/npm reads itself — provide both so neither auth path sees an
          # empty token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
